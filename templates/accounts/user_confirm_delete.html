<div class="card">
    <div class="card-header"><i class="fas fa-trash"></i> Confirm Delete</div>
    <div class="card-body">
        <p>Are you sure you want to delete user <strong>{{ del_user.username }}</strong>?</p>
        <p class="text-muted">This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Delete</button>
                <a href="{% url 'settings_app:users' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
