<div class="card">
    <div class="card-header"><i class="fas fa-user"></i> {{ title }}</div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                {{ field.label_tag }}
                {{ field }}
                {% if field.help_text %}<div class="help-text">{{ field.help_text }}</div>{% endif %}
                {% if field.errors %}<ul class="errorlist">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
            </div>
            {% endfor %}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
                <a href="{% url 'settings_app:users' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
