{% extends 'base.html' %}
{% block title %}Delete Expense - {{ block.super }}{% endblock %}
{% block page_title %}Delete Expense{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;margin:2rem auto;">
    <div class="card-header"><i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i> Confirm Delete</div>
    <div class="card-body">
        <p>Are you sure you want to delete expense <strong>{{ expense.title }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Delete</button>
                <a href="{% url 'expenses:expense_list' %}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
