<nav class="navbar">
    <div class="navbar-left">
        <button class="toggle-sidebar"><i class="fas fa-bars"></i></button>
        <span class="page-title">{% block page_title %}{% endblock %}</span>
    </div>
    <div class="navbar-right">
        {% if low_stock_count > 0 %}
        <a href="{% url 'reports:low_stock_report' %}" class="btn btn-outline btn-sm" title="Low Stock Alerts">
            <i class="fas fa-exclamation-triangle" style="color: var(--warning);"></i>
            <span class="badge badge-danger">{{ low_stock_count }}</span>
        </a>
        {% endif %}
        <div class="navbar-user">
            {% if user.profile.avatar %}
            <img src="{{ user.profile.avatar.url }}" class="avatar" alt="{{ user.username }}">
            {% else %}
            <div class="avatar">{{ user.username|first|upper }}</div>
            {% endif %}
            <div class="user-info">
                <div class="user-name">{{ user.get_full_name|default:user.username }}</div>
                <div class="user-role">{{ user.profile.get_role_display }}</div>
            </div>
        </div>
    </div>
</nav>
