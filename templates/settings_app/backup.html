<div class="card">
    <div class="card-header"><i class="fas fa-database"></i> Database Backup</div>
    <div class="card-body">
        <p>Create a backup of your database.</p>
        <a href="{% url 'settings_app:backup_run' %}" class="btn btn-warning"><i class="fas fa-download"></i> Backup Database Now</a>
    </div>
</div>
{% if backups %}
<div class="card">
    <div class="card-header"><i class="fas fa-history"></i> Recent Backups</div>
    <div class="card-body">
        <div class="table-container">
            <table>
                <thead><tr><th>Date</th><th>File</th><th>Notes</th></tr></thead>
                <tbody>
                    {% for b in backups %}
                    <tr>
                        <td>{{ b.created_at|date:'d M Y H:i' }}</td>
                        <td>{{ b.file }}</td>
                        <td>{{ b.notes|default:'-' }}</td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="3" style="text-align:center;">No backups yet.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endif %}
